[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
  "alembic<2.0.0,>=1.12.1",
  "beautifulsoup4>=4.14.3",
  "chirashi",
  "diving-board",
  "email-validator<3.0.0.0,>=2.1.0.post1",
  "emails<1.0,>=0.6",
  "fastapi[standard]<0.129.0,>=0.128.0",
  "httpx<1.0.0,>=0.25.1",
  "jinja2<4.0.0,>=3.1.4",
  "just-scrape",
  "loguru>=0.7.3",
  "naphki",
  "not-yt-dlapi",
  "psycopg[binary]<4.0.0,>=3.1.13",
  "pwdlib[argon2,bcrypt]>=0.3.0",
  "pydantic>2.0",
  "pydantic-settings<3.0.0,>=2.2.1",
  "pyinstrument>=5.1.2",
  "pyjwt<3.0.0,>=2.8.0",
  "python-multipart<1.0.0,>=0.0.27",
  "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
  "sqlmodel<1.0.0,>=0.0.21",
  "tenacity<9.0.0,>=8.2.3",
  "yt-dlapi",
]

[dependency-groups]
dev = [
  "coverage<8.0.0,>=7.4.3",
  "freezegun>=1.0.0",
  "mypy<2.0.0,>=1.8.0",
  "prek>=0.2.24,<1.0.0",
  "pytest<8.0.0,>=7.4.3",
  "pytest-socket>=0.7.0",
  "pytest-split>=0.11.0",
  "ruff<1.0.0,>=0.2.2",
  "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Block network access for plugin tests.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Ignores from the original template
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "W191",  # indentation contains tabs
  "B904",  # Allow raising exceptions without from e, for HTTPException

  # # Additional ignores
  # # Too many false positives
  # TODO: Go through all code so these linters can be used.
  "TC001",
  "TC002",
  "TC003",

  # Allow all TODO comments
  "TD",
  "FIX002"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Asserts should be allowed in tests.

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ty.terminal]
error-on-warning = true

[tool.uv.sources]
just-scrape = { git = "https://github.com/ryn-cx/just-scrape" }
yt-dlapi = { git = "https://github.com/ryn-cx/yt-dlapi" }
diving-board = { git = "https://github.com/ryn-cx/diving-board" }
chirashi = { git = "https://github.com/ryn-cx/chirashi" }
naphki = { git = "https://github.com/ryn-cx/naphki" }
not-yt-dlapi = { git = "https://github.com/ryn-cx/not-yt-dlapi" }
